<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agenda Administrador</title>
    <link rel="stylesheet" href="agendas citas.css">
    <link rel="stylesheet" href="agendar citas .JabaScript.js">
</head>
<body>

<div class="container">

    <h1>Agenda Administrador</h1>

    <div class="formulario">
        <input type="text" id="cliente" placeholder="Nombre del Cliente">
        <input type="text" id="servicio" placeholder="Servicio">
        <input type="time" id="hora">
        <input type="date" id="fecha">
        <button onclick="agregarCita()">Agregar Cita</button>
    </div>

    <div class="agenda">
        <div class="columna" data-hora="08:00"><h3>08:00</h3></div>
        <div class="columna" data-hora="09:00"><h3>09:00</h3></div>
        <div class="columna" data-hora="10:00"><h3>10:00</h3></div>
        <div class="columna" data-hora="11:00"><h3>11:00</h3></div>
        <div class="columna" data-hora="12:00"><h3>12:00</h3></div>
        <div class="columna" data-hora="13:00"><h3>13:00</h3></div>
        <div class="columna" data-hora="14:00"><h3>14:00</h3></div>
        <div class="columna" data-hora="15:00"><h3>15:00</h3></div>
        <div class="columna" data-hora="16:00"><h3>16:00</h3></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
